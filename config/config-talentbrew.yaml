# config/config-talentbrew.yaml
# TalentBrew/Radancy career sites.
# Loaded automatically by poller.py.
#
# HOW TO VERIFY:
#   Open the search_path on base_url and confirm result rows include
#   .search-results__job-title-link, .search-results__job-location, and
#   .search-results__job-date-posted.
#
# McKesson notes:
#   - Job Function filter is carried in `ascf`.
#   - United States and Remote are TalentBrew location facet IDs in `alrpm`.
#   - The scraper queries those facets separately and appends the facet label
#     to vague rows like "Multiple" so the shared location filter can work.
#   - Newer Radancy/TalentBrew sites use `k` keyword searches and sometimes
#     expose posted dates only on detail pages; detail_fetch_limit caps those
#     follow-up requests after title/location filters have already passed.

companies:

  - name: McKesson
    ats: talentbrew
    base_url: https://careers.mckesson.com
    search_path: /en/search-jobs
    query_params:
      acm: ALL
      ascf: '[{"key":"custom_fields.JobFunction","value":"Information Technology"}]'
    location_params:
      - "6252001"        # United States
      - "1000000000100"  # Remote
    location_param_labels:
      "6252001": United States
      "1000000000100": Remote
    max_pages: 5
    max_age_days: 1
    active: true

  - name: Comcast
    ats: talentbrew
    base_url: https://jobs.comcast.com
    search_path: /search-jobs
    search_terms:
      - software engineer
      - software developer
      - cloud engineer
      - devops engineer
      - backend engineer
      - full stack
      - ai engineer
      - ml engineer
      - application developer
    max_pages: 2
    max_age_days: 1
    active: true

  - name: AT&T
    ats: talentbrew
    base_url: https://www.att.jobs
    search_path: /search-jobs
    search_terms:
      - software engineer
      - software developer
      - cloud engineer
      - devops engineer
      - backend engineer
      - full stack
      - application developer
    max_pages: 2
    detail_fetch_limit: 15
    max_age_days: 1
    active: true

  - name: UnitedHealth Group
    ats: talentbrew
    base_url: https://careers.unitedhealthgroup.com
    search_path: /search-jobs
    search_terms:
      - software engineer
      - software developer
      - cloud engineer
      - devops engineer
      - backend engineer
      - full stack
      - ai engineer
      - ml engineer
      - application developer
    max_pages: 2
    detail_fetch_limit: 15
    max_age_days: 1
    active: true

  - name: Walgreens
    ats: talentbrew
    base_url: https://jobs.walgreens.com
    search_path: /en/search-jobs
    search_terms:
      - software engineer
      - software developer
      - cloud engineer
      - devops engineer
      - backend engineer
      - full stack
      - ai engineer
      - ml engineer
      - application developer
    max_pages: 2
    detail_fetch_limit: 10
    max_age_days: 1
    active: true
