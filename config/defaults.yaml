# config/defaults.yaml
# Shared defaults applied by poller.py to every company in config/config-*.yaml.
#
# Company entries can still override `keywords` / `locations` directly, or
# append with `extra_keywords` / `extra_locations`.

defaults:
  keywords:
    - software engineer
    - software developer
    - python developer
    - full stack
    - backend engineer
    - devops engineer
    - cloud engineer
    - ai engineer
    - ml engineer
    - forward deployed engineer
    - application developer
    - web developer
    - embedded software engineer
    - iot engineer
    - embedded systems engineer

  locations:
    - United States
    - Remote
